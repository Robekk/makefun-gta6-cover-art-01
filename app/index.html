<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marina Heat — Cast Cover Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">★</span>
    <span class="brand-name">MARINA HEAT</span>
    <span class="brand-sub">Cast Cover Studio</span>
  </div>
  <div class="top-actions">
    <div class="switcher" role="group" aria-label="Layout">
      <button type="button" data-layout="landscape" class="active">Landscape</button>
      <button type="button" data-layout="square">Square</button>
      <button type="button" data-layout="portrait">Portrait</button>
    </div>
    <label class="palette-pick">Palette
      <select id="paletteSelect"></select>
    </label>
    <div class="exports" role="group" aria-label="Export PNG">
      <button type="button" data-export="landscape">PNG 1920×1080</button>
      <button type="button" data-export="square">PNG 1080×1080</button>
      <button type="button" data-export="portrait">PNG 1080×1350</button>
    </div>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <canvas id="cover" width="1920" height="1080"></canvas>
    <p class="hint">Drag the cover to reframe the selected cast member · scroll to zoom their shot.</p>
  </section>

  <aside class="panel">
    <section class="block">
      <h2>Cast panels</h2>
      <div id="chips" class="chips"></div>
      <h3>Photo for the selected panel</h3>
      <div id="photoGrid" class="photo-grid"></div>
      <label class="upload">Use your own photo
        <input type="file" id="ownPhoto" accept="image/*">
      </label>
    </section>

    <section class="block">
      <h2>Selected panel</h2>
      <label>Role tag
        <input type="text" id="roleInput" autocomplete="off">
      </label>
      <label>Name
        <input type="text" id="nameInput" autocomplete="off">
      </label>
      <label>Zoom <span id="zoomVal"></span>
        <input type="range" id="zoomRange" min="1" max="3" step="0.01">
      </label>
      <p class="crop-read" id="cropRead"></p>
      <button type="button" id="resetCrop" class="ghost">Reset framing</button>
    </section>

    <section class="block" id="words">
      <h2>Words &amp; furniture</h2>
      <label>Title
        <input type="text" data-word="title" autocomplete="off">
      </label>
      <label>Subtitle (script)
        <input type="text" data-word="subtitle" autocomplete="off">
      </label>
      <label>Ribbon
        <input type="text" data-word="ribbon" autocomplete="off">
      </label>
      <label>Quote bar
        <input type="text" data-word="quote" autocomplete="off">
      </label>
      <label>Publisher
        <input type="text" data-word="publisher" autocomplete="off">
      </label>
      <label>Volume
        <input type="text" data-word="volume" autocomplete="off">
      </label>
      <label>Billing block
        <input type="text" data-word="billing" autocomplete="off">
      </label>
      <label>Coming soon
        <input type="text" data-word="comingSoon" autocomplete="off">
      </label>
      <label>Seal text
        <input type="text" data-word="seal" autocomplete="off">
      </label>
    </section>
  </aside>
</main>

<script src="src/state.js"></script>
<script src="src/cover.js"></script>
<script src="src/main.js"></script>
</body>
</html>
